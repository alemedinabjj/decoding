# Alternativa local ao Neon: Postgres 17 com pgvector.
# Uso: docker compose up -d  →  ajuste DATABASE_URL e DATABASE_URL_READONLY conforme .env.example
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: decoding-postgres
    environment:
      POSTGRES_USER: decoding_owner
      POSTGRES_PASSWORD: decoding
      POSTGRES_DB: decoding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoding_owner -d decoding"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
